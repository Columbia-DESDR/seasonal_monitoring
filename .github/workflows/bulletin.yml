name: Monthly bulletin

on:
  workflow_dispatch:
  schedule:
    # 10th of each month at 13:00 UTC. Rainfall data runs roughly four
    # weeks behind, so by the 10th the previous month is complete.
    # fetch.py works out the reporting month itself, so this date only
    # has to be late enough.
    - cron: "0 13 10 * *"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # One job per country, run side by side. Each name here is a file
    # in configs/, so adding a country is that file plus one word on
    # this line. fail-fast is off so that one country failing does not
    # cancel the others halfway through.
    strategy:
      fail-fast: false
      matrix:
        country: [yemen, ethiopia]

    env:
      # Typed here, as on main. Neither is sensitive: without the key,
      # which is a secret, knowing them lets nobody in.
      EE_PROJECT: desdr-510913
      EE_SERVICE_ACCOUNT_EMAIL: seasonal-monitoring@desdr-510913.iam.gserviceaccount.com

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install LibreOffice
        # Only for the --pdf step. Impress alone rather than the whole
        # office suite, which saves a couple of minutes per run.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-impress

      - name: Write the service account key
        # The secret holds the JSON itself, but the code expects a path,
        # so it is written to the runner's temp directory and the path
        # handed to later steps through GITHUB_ENV. Passed through env
        # rather than inlined into the shell, which keeps the contents
        # off the command line and out of the logs.
        env:
          KEY_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          if [ -z "$KEY_JSON" ]; then
            echo "::error::Secret EE_SERVICE_ACCOUNT_KEY_JSON is not set."
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/ee-key.json"
          printf '%s' "$KEY_JSON" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "EE_SERVICE_ACCOUNT_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Fetch the monitoring maps
        run: python fetch.py --config configs/${{ matrix.country }}.yaml

      - name: Pull the forecast and the rainfall record
        # Needed before the forecast slides: this downloads the forecast
        # from Earth Engine and the observed rainfall the drought threshold
        # comes from. When there is no forecast it says so and stops
        # without failing, and the deck goes out without those slides.
        run: python observed.py --config configs/${{ matrix.country }}.yaml

      - name: Build the deck
        # Runs forecast.py itself, so there is no separate step for it.
        run: python build_deck.py --pdf --config configs/${{ matrix.country }}.yaml

      - name: Upload the bulletin
        uses: actions/upload-artifact@v4
        with:
          # Named per country, or the second job would overwrite the first.
          name: bulletin-${{ matrix.country }}
          path: |
            output/${{ matrix.country }}/*.pptx
            output/${{ matrix.country }}/*.pdf
          if-no-files-found: error
          retention-days: 90
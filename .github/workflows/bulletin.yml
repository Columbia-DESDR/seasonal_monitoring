name: Monthly bulletin

on:
  workflow_dispatch:
  schedule:
    # 10th of each month at 13:00 UTC. Rainfall data runs roughly four
    # weeks behind, so by the 10th the previous month is complete.
    # fetch.py works out the reporting month itself, so this date only
    # has to be late enough.
    - cron: "0 13 10 * *"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Repository variables, not secrets. Set them under Settings,
      # Secrets and variables, Actions, Variables tab. Neither is
      # sensitive; they are variables so this file carries no one
      # organisation's project id.
      #
      # Only contexts GitHub allows at job level belong here. The runner
      # context is not one of them, so the key path is set by the step
      # that writes the key rather than declared up here.
      EE_PROJECT: ${{ vars.EE_PROJECT }}
      EE_SERVICE_ACCOUNT_EMAIL: ${{ vars.EE_SERVICE_ACCOUNT_EMAIL }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Check the Earth Engine settings
        # Fail here with a plain sentence rather than several steps
        # later with an Earth Engine error that does not say what is
        # actually missing.
        run: |
          [ -n "$EE_PROJECT" ] || {
            echo "::error::Repository variable EE_PROJECT is not set."
            exit 1
          }
          [ -n "$EE_SERVICE_ACCOUNT_EMAIL" ] || {
            echo "::error::Repository variable EE_SERVICE_ACCOUNT_EMAIL is not set."
            exit 1
          }
          echo "Project $EE_PROJECT"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install LibreOffice
        # Only for the --pdf step. Impress alone rather than the whole
        # office suite, which saves a couple of minutes per run.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-impress

      - name: Write the service account key
        # The secret holds the JSON itself, but the code expects a path,
        # so it is written to the runner's temp directory and the path
        # handed to later steps through GITHUB_ENV. Passed through env
        # rather than inlined into the shell, which keeps the contents
        # off the command line and out of the logs.
        env:
          KEY_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          if [ -z "$KEY_JSON" ]; then
            echo "::error::Secret EE_SERVICE_ACCOUNT_KEY_JSON is not set."
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/ee-key.json"
          printf '%s' "$KEY_JSON" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "EE_SERVICE_ACCOUNT_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Fetch the monitoring maps
        run: python fetch.py

      - name: Pull the rainfall record
        # Needed before the forecast: the drought threshold is a
        # percentile of observed rainfall, and this is what writes it.
        # Skipped when no forecast files are committed, since there is
        # then nothing to compare against.
        run: |
          if ls forecasts/forecast_mu_*.tif >/dev/null 2>&1; then
            python observed.py
          else
            echo "No forecast files in forecasts/, so no forecast slide."
          fi

      - name: Build the deck
        # Runs forecast.py itself, so there is no separate step for it.
        run: python build_deck.py --pdf

      - name: Upload the bulletin
        uses: actions/upload-artifact@v4
        with:
          name: bulletin
          path: |
            output/*.pptx
            output/*.pdf
          if-no-files-found: error
          retention-days: 90
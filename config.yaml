# Bulletin configuration.
# Everything region-specific lives here, so the code stays the same
# when you point it at another country.

region:
  name: Yemen
  boundary_collection: "WM/geoLab/geoBoundaries/600/ADM1"
  filter_property: shapeGroup
  filter_value: YEM

bulletin:
  title: "Yemen Seasonal Monitoring"
  # Which month this bulletin reports on.
  #
  # Leave both blank and it is worked out from what Earth Engine actually
  # holds: the most recent month that every dataset fully covers. CHIRPS
  # usually decides, since it runs about four weeks behind.
  #
  # Fill both in to rebuild an older bulletin.
  year:
  month:

# Each variable becomes one slide: a 2x2 grid of
# [top row]    the standardized anomaly at 1-month and 3-month
# [bottom row] a second view at 1-month and 3-month
layers:
  - key: rainfall
    label: Rainfall
    source_label: "CHIRPS"
    source_detail: "CHIRPS (UCSB-CHG/CHIRPS/DAILY)"
    collection: "UCSB-CHG/CHIRPS/DAILY"
    band: precipitation
    clim_start: 1981
    clim_end: 2025
    palette: ["B78200", "FFFFFF", "0027FF"]
    second_row: anomaly_pct

  - key: soil_moisture
    label: Soil Moisture
    source_label: "SMAP L3 Enhanced"
    source_detail: "SMAP L3 Enhanced (NASA/SMAP/SPL3SMP_E/005, NASA/SMAP/SPL3SMP_E/006)"
    # Two collections merged. 005 holds the historical record, 006 carries
    # it on from 2024. Loading only 006 silently shrinks the baseline to a
    # couple of years, which quietly corrupts every anomaly.
    collection:
      - "NASA/SMAP/SPL3SMP_E/005"
      - "NASA/SMAP/SPL3SMP_E/006"
    band: soil_moisture_am
    clim_start: 2016
    clim_end: 2025
    palette: ["B78200", "FFFFFF", "0027FF"]
    second_row: anomaly_pct

  - key: vegetation
    label: Vegetation
    source_label: "VIIRS NDVI"
    source_detail: "VIIRS NDVI (NASA/VIIRS/002/VNP13A1)"
    collection: "NASA/VIIRS/002/VNP13A1"
    band: NDVI
    clim_start: 2013
    clim_end: 2025
    palette: ["a36437", "FCD163", "207401"]
    second_row: vci

# Trailing window lengths, in days. 1-month and 3-month.
windows:
  - { key: "1month", label: "1-month", days: 30 }
  - { key: "3month", label: "3-month", days: 90 }

# Optional forecast slide, computed from PyCPT output by forecast.py.
#
# These are GeoTIFFs on disk rather than Earth Engine assets, because nothing
# uploads PyCPT output to Earth Engine yet. Once that pipeline exists this
# section points at an asset instead. Clear the three file paths to skip the
# forecast slide entirely.
#
# All three must share one grid: the threshold is taken from the hindcast and
# compared against the forecast pixel by pixel, which only means anything if
# they line up. Taking the threshold from the hindcast rather than from CHIRPS
# is what keeps that true, and avoids reconciling two different resolutions
# and two different unit conventions.
forecasts:
  heading: "Seasonal Forecast"
  season: "OND 2026"
  note: "PyCPT 2.10.2, initialized September 2026. Drought threshold is the 20th percentile of the hindcast."
  source_detail: "PyCPT 2.10.2 MME deterministic forecast and prediction error variance, hindcast 1983-2024"
  dir: forecasts
  hindcast_mu: forecasts/hindcast_mu.tif
  forecast_mu: forecasts/forecast_mu_2026.tif
  forecast_var: forecasts/forecast_var_2026.tif

  # What counts as a drought. The 20th percentile means the worst one year in
  # five historically, which also makes 0.20 the probability you would expect
  # from a forecast carrying no information. A policy choice, not a
  # statistical one: lower covers rarer, more severe events.
  threshold_percentile: 20

  # Where the threshold is taken from. This should be OBSERVED seasonal
  # rainfall, one band per year, on the same grid as the forecast, because
  # PyCPT's prediction error variance is measured against observations.
  #
  # Left blank, forecast.py falls back to the hindcast and the probabilities
  # come out too high: the hindcast holds the model's own predictions, and
  # predictions regress toward the mean, so their spread is narrower than
  # real rainfall and the percentile is not extreme enough. forecast.py
  # measures the error on every run and marks the slide when it is large.
  observed_rainfall:

  # The PyCPT grid is 0.25 degrees, much coarser than the CHIRPS maps on the
  # other slides, so drawn one square per cell it looks blocky beside them.
  # Interpolating matches how the Code Editor displays the same data. Set
  # false to see the model's real resolution.
  smooth_maps: true

  # Max's palette from the Code Editor, so the map reads the same way as the
  # dashboard version: navy through green, yellow, orange, red.
  probability_palette: ["001137", "0aab1e", "e7eb05", "ff4a2d", "e90000"]
  departure_palette: ["B78200", "FFFFFF", "0027FF"]

  # Fallback: static screenshots from the maproom, used only when the files
  # above are absent. This is what the hand-made bulletin did.
  images: []
  #   - { file: april.png, caption: "Issued April Lead Time" }

method_text: >-
  Standardized values are z-scores: the period mean minus the long-term mean
  for the same period, divided by the year-to-year standard deviation of that
  period mean. They are not gamma-fitted SPI, so standard SPI drought category
  thresholds do not apply. Percentage values are departure from normal, where
  0 means normal. VCI is a 0-100 position between the best and worst on record
  for each pixel. Windows are trailing: a 3-month figure covers the reported
  month and the two preceding it. Values are standardized against the full
  climatological record, the conventional approach.

disclaimer_text: >-
  Content is based on the most recent remote sensing data available at the time
  of publication. Conditions are dynamic and may not fully reflect the situation
  on the ground. Standardized values are z-scores relative to the stated
  climatological period, not gamma-fitted SPI, so standard SPI drought category
  thresholds do not apply.

output:
  dir: output
  # Pixel width of the rendered map pulled from Earth Engine.
  map_width_px: 900
